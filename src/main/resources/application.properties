spring.application.name=smart-hr-management-system
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_hr}
spring.datasource.username=${DB_USERNAME:${DB_User:${DB_USER:postgres}}}
spring.datasource.password=${DB_PASSWORD:${DB_Password:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
app.jwt.secret=${JWT_SECRET:SmartHR-Secret-Key-Change-In-Production-2026-At-Least-32-Bytes}
app.jwt.expiration=86400000
