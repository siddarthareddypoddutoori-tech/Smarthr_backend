spring.application.name=smart-hr-management-system
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_hr}
spring.datasource.username=${DB_USERNAME:${DB_User:${DB_USER:root}}}
spring.datasource.password=${DB_PASSWORD:${DB_Password:root}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
app.jwt.secret=${JWT_SECRET:SmartHR-Secret-Key-Change-In-Production-2026-At-Least-32-Bytes}
app.jwt.expiration=86400000
